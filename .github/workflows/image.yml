name: Build Docker Image

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        id: build
        run: |
          IMAGE="adminer:${GITHUB_SHA}"
          docker build ./6 --tag "$IMAGE"
          printf 'image=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"
          VERSION="$(awk '$1 == "ENV" && $2 ~ /^ADMINER_VERSION=/ { sub(/^ADMINER_VERSION=/, "", $2); print $2; exit }' 6/Dockerfile)"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: docker run --name adminer_smoke -d "${{ steps.build.outputs.image }}"
      - name: Verify database drivers
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          modules="$(docker run --rm --entrypoint php "$IMAGE" -m)"
          for module in mysqli PDO pdo_mysql pdo_odbc pdo_dblib pdo_pgsql pdo_sqlite; do
            if ! grep -Fxiq "$module" <<< "$modules"; then
              echo "Missing PHP extension: $module" >&2
              exit 1
            fi
          done
      - name: Verify a restart works
        run: |
          docker run --name adminer_restart -d "${{ steps.build.outputs.image }}"
          docker run -i --rm --link adminer_restart:adminer_restart buildpack-deps:curl \
            curl -fsSL http://adminer_restart:8080/
          docker restart adminer_restart
          docker run -i --rm --link adminer_restart:adminer_restart buildpack-deps:curl \
            curl -fsSL http://adminer_restart:8080/
      - name: Verify version
        run: |
          docker run --name adminer_version -d "${{ steps.build.outputs.image }}"
          docker run -i --rm --link adminer_version:adminer_version buildpack-deps:curl \
            curl -fsSL http://adminer_version:8080/ \
            | grep '<span class=.version.>${{ steps.build.outputs.version }}'
      - name: Verify that no warnings appear
        run: |
          docker run --name adminer_warnings -d "${{ steps.build.outputs.image }}"
          ! docker run -i --rm --link adminer_warnings:adminer_warnings buildpack-deps:curl \
            curl -fsSL http://adminer_warnings:8080/ \
            | grep '<b>Warning</b>:'
      - name: Verify Docker Hub credentials
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish." >&2
            exit 1
          fi
      - name: Set up QEMU
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish multi-platform image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: ./6
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/adminer:${{ steps.build.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/adminer:6
            ${{ secrets.DOCKERHUB_USERNAME }}/adminer:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/adminer:${{ steps.build.outputs.version }}-standalone
            ${{ secrets.DOCKERHUB_USERNAME }}/adminer:6-standalone
            ${{ secrets.DOCKERHUB_USERNAME }}/adminer:standalone
